rules:
  # AutoDL / SeetaCloud SSH gateway must bypass Stash TUN/proxy.
  - PROCESS-NAME,ssh,DIRECT
  - PROCESS-NAME,scp,DIRECT
  - PROCESS-NAME,sftp,DIRECT
  - DOMAIN,connect.westd.seetacloud.com,DIRECT
  - DOMAIN,gtm-adl-westd-connect.seetacloud.com,DIRECT
  - DOMAIN-SUFFIX,seetacloud.com,DIRECT
  - IP-CIDR,36.103.198.204/32,DIRECT,no-resolve
  # Tencent COS / Tencent Cloud should stay domestic/direct for AutoDL transfer.
  - PROCESS-NAME,coscli,DIRECT
  - DOMAIN,cos.ap-chengdu.myqcloud.com,DIRECT
  - DOMAIN,cosbrowser.cloud.tencent.com,DIRECT
  - DOMAIN,mirrors.cloud.tencent.com,DIRECT
  - DOMAIN-SUFFIX,myqcloud.com,DIRECT
  - DOMAIN-SUFFIX,cloud.tencent.com,DIRECT
  - DOMAIN-SUFFIX,qcloud.com,DIRECT
  # Allow QUIC (UDP/443) for LinkedIn — some page assets/messages use HTTP/3.
  - AND,((DOMAIN-SUFFIX,linkedin.com),(NETWORK,UDP)),LinkedIn
  - AND,((DOMAIN-SUFFIX,licdn.com),(NETWORK,UDP)),LinkedIn
  - AND,((DOMAIN-SUFFIX,linkedin.cn),(NETWORK,UDP)),LinkedIn
  - AND,((DOMAIN-SUFFIX,lnkd.in),(NETWORK,UDP)),LinkedIn
  - AND,((DOMAIN-SUFFIX,licdn.cn),(NETWORK,UDP)),LinkedIn
  - SCRIPT,quic,REJECT
  # Claude Code / Anthropic — fixed US proxy, block telemetry
  - DOMAIN-SUFFIX,anthropic.com,Claude
  - DOMAIN-SUFFIX,claude.ai,Claude
  - DOMAIN-SUFFIX,claude.com,Claude
  - DOMAIN,mcp-proxy.anthropic.com,Claude
  - DOMAIN-KEYWORD,anthropic,Claude
  - DOMAIN-KEYWORD,claude,Claude
  - DOMAIN-SUFFIX,datadoghq.com,REJECT
  - DOMAIN-SUFFIX,statsig.com,REJECT
  - DOMAIN-SUFFIX,sentry.io,REJECT
  # OpenAI / ChatGPT
  - DOMAIN-SUFFIX,openai.com,OpenAI
  - DOMAIN-SUFFIX,chatgpt.com,OpenAI
  - DOMAIN-SUFFIX,oaiusercontent.com,OpenAI
  - DOMAIN-SUFFIX,oaistatic.com,OpenAI
  - DOMAIN-SUFFIX,auth0.com,OpenAI
  - DOMAIN-SUFFIX,wandb.ai,选择代理
  - DOMAIN-SUFFIX,weightsandbiases.com,选择代理
  - DOMAIN-KEYWORD,openai,OpenAI
  - DOMAIN-KEYWORD,chatgpt,OpenAI
  - DOMAIN-KEYWORD,codex,OpenAI
  - DOMAIN-KEYWORD,wandb,选择代理
  # Netflix
  - GEOSITE,netflix,Netflix
  # Disney+
  - GEOSITE,disney,Disney+
  # Spotify
  - GEOSITE,spotify,Spotify
  # Speedtest
  - GEOSITE,speedtest,DIRECT
  # Homebrew and GitHub package endpoints should use proxy. Keep only raw SSH direct.
  - DOMAIN-SUFFIX,formulae.brew.sh,GitHub
  - DOMAIN-SUFFIX,ghcr.io,GitHub
  - DOMAIN-SUFFIX,api.github.com,GitHub
  - DOMAIN-SUFFIX,github.com,GitHub
  - DOMAIN-SUFFIX,ssh.github.com,DIRECT
  - DOMAIN-SUFFIX,githubusercontent.com,GitHub
  - DOMAIN-SUFFIX,githubassets.com,GitHub
  - GEOSITE,github,GitHub
  # Telegram
  - IP-ASN,62014,选择代理,no-resolve
  - IP-ASN,59930,选择代理,no-resolve
  - IP-ASN,44907,选择代理,no-resolve
  - IP-ASN,211157,选择代理,no-resolve
  - PROCESS-NAME,Telegram.exe,选择代理
  - PROCESS-NAME,Telegram,选择代理
  - GEOSITE,telegram,选择代理
  # YouTube
  - GEOSITE,youtube,YouTube
  # Google
  - GEOSITE,google,Google
  - DOMAIN-SUFFIX,digid.nl,选择代理
  - DOMAIN-SUFFIX,arxiv.org,选择代理
  - DOMAIN-SUFFIX,tavus.io,选择代理
  # Twitter
  - GEOSITE,twitter,Social
  - DOMAIN-SUFFIX,tapbots.com,Social
  # Instagram
  - GEOSITE,instagram,选择代理
  # Facebook
  - GEOSITE,facebook,选择代理
  # LinkedIn
  - DOMAIN-SUFFIX,linkedin.com,LinkedIn
  - DOMAIN-SUFFIX,linkedin.cn,LinkedIn
  - DOMAIN-SUFFIX,licdn.com,LinkedIn
  - DOMAIN-SUFFIX,lnkd.in,LinkedIn
  - DOMAIN-SUFFIX,licdn.cn,LinkedIn
  - GEOSITE,linkedin,LinkedIn
  - RULE-SET,gfw,选择代理
  # Steam
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,steam,DIRECT
  # Apple LBS
  - DOMAIN-SUFFIX,iphone-ld.apple.com,DIRECT
  - DOMAIN-SUFFIX,lcdn-locator.apple.com,DIRECT
  - DOMAIN-SUFFIX,lcdn-registration.apple.com,DIRECT
  - DOMAIN-SUFFIX,push.apple.com,DIRECT
  # Apple OCSP
  - PROCESS-NAME,trustd,选择代理
  # Microsoft
  - GEOSITE,microsoft@cn,DIRECT
  - GEOSITE,microsoft,DIRECT
  - GEOSITE,xbox,DIRECT
  # common proxy utils
  - PROCESS-NAME,v2ray,DIRECT
  - PROCESS-NAME,Surge,DIRECT
  - PROCESS-NAME,ss-local,DIRECT
  - PROCESS-NAME,privoxy,DIRECT
  - PROCESS-NAME,trojan,DIRECT
  - PROCESS-NAME,trojan-go,DIRECT
  - PROCESS-NAME,naive,DIRECT
  - PROCESS-NAME,CloudflareWARP,DIRECT
  - PROCESS-NAME,Cloudflare WARP,DIRECT
  - IP-CIDR,162.159.193.0/24,DIRECT,no-resolve
  - PROCESS-NAME,p4pclient,DIRECT
  - PROCESS-NAME,Thunder,DIRECT
  - PROCESS-NAME,DownloadService,DIRECT
  - PROCESS-NAME,qbittorrent,DIRECT
  - PROCESS-NAME,Transmission,DIRECT
  - PROCESS-NAME,fdm,DIRECT
  - PROCESS-NAME,aria2c,DIRECT
  - PROCESS-NAME,Folx,DIRECT
  - PROCESS-NAME,NetTransport,DIRECT
  - PROCESS-NAME,uTorrent,DIRECT
  - PROCESS-NAME,WebTorrent,DIRECT
  # China domains that need DIRECT access
  - DOMAIN-SUFFIX,ikea.cn,DIRECT
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,默认
script:
  shortcuts:
    quic: network == 'udp' and dst_port == 443
dns:
  default-nameserver:
    - 114.114.115.115
    - 119.28.28.28
    - 223.6.6.6
    - system
  nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
    - https://1.12.12.12/dns-query
    - https://120.53.53.53/dns-query
  nameserver-policy:
    "+.anthropic.com": https://1.1.1.1/dns-query
    "+.claude.ai": https://1.1.1.1/dns-query
    "+.claude.com": https://1.1.1.1/dns-query
    "+.openai.com": https://1.1.1.1/dns-query
    "+.chatgpt.com": https://1.1.1.1/dns-query
    "+.oaiusercontent.com": https://1.1.1.1/dns-query
    "+.sentry.io": https://1.1.1.1/dns-query
log-level: warning
mode: rule
proxies:
  - name: VLESSReality
    type: vless
    server: YOUR_VLESS_SERVER
    port: 443
    uuid: YOUR_VLESS_UUID
    cipher: auto
    tls: true
    flow: xtls-rprx-vision
    servername: YOUR_REALITY_SNI
    sni: YOUR_REALITY_SNI
    client-fingerprint: chrome
    reality-opts:
      public-key: YOUR_REALITY_PUBLIC_KEY
      short-id: YOUR_REALITY_SHORT_ID
